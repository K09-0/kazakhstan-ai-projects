    environment:
      - BOT_NAME=tenderbot
    volumes:
      - tenderbot_data:/app/data
      - ./shared:/app/shared:ro
      - ./tenderbot/bot:/app/bot:ro
      - ./tenderbot/parser:/app/parser:ro
      - ./tenderbot/ai:/app/ai:ro
    working_dir: /app
    command: ["python", "-m", "bot.main"]

