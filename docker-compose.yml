version: "3.8"

x-bot-base: &bot-base
  build:
    dockerfile: ../Dockerfile.base
  env_file: []
  environment:
    - KASPI_PHONE=77017891857
    - KASPI_DB_PATH=/app/data/kaspi_payments.db
    - PYTHONUNBUFFERED=1
  volumes:
    - bot_data:/app/data
    - ../shared:/app/shared:ro
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        memory: 256M
      reservations:
        memory: 64M

services:
  asyqverse-bot:
    <<: *bot-base
    container_name: asyqverse-bot
    build:
      context: ./asyqverse
      dockerfile: ../Dockerfile.base
    env_file:
      - ./asyqverse/.env
    environment:
      - BOT_NAME=asyqverse
    volumes:
      - asyqverse_data:/app/data
      - ./shared:/app/shared:ro
      - ./asyqverse/bot:/app/bot:ro
    working_dir: /app
    command: ["python", "-m", "bot.main"]

  koremin-bot:
    <<: *bot-base
    container_name: koremin-bot
    build:
      context: ./koremin
      dockerfile: ../Dockerfile.base
    env_file:
      - ./koremin/.env
    environment:
      - BOT_NAME=koremin
    volumes:
      - koremin_data:/app/data
      - ./shared:/app/shared:ro
      - ./koremin/bot:/app/bot:ro
    working_dir: /app
    command: ["python", "-m", "bot.main"]

  tenderbot-bot:
